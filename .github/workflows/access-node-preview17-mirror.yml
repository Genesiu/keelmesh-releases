name: Publish verified Linux Access Node Preview 17
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mirror accepted Linux node packages and publish the owned draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import pathlib,urllib.request,urllib.parse,hashlib,json,subprocess,os,time
          expected={'Keelark-Access-Node-0.2.3-preview.17-Linux-arm64.tar.gz.sig': 'ba89edfea603a8ba18caa6dace46bb97b20b313ce5420e845ff78fa1af6dcea5', 'Keelark-Access-Node-0.2.3-preview.17-Linux-amd64.tar.gz.manifest.json': '1dc227f3ed9f2fdb307fbea55bcc817c4ffe8c0d54fff39d9d2fc9e87df1fc95', 'Keelark-Access-Node-0.2.3-preview.17-Linux-arm64.tar.gz': 'e14ae2efd00cf3cb4ce0011d13f579545cc3fd6ee2c20171e263c0947d3afa1d', 'README-Muse.zh.md': '821f0cc95f201be620420de51080c8a795426f22985807f4a1eea9b3494c07ba', 'verify-download.py': '1fdf39fd1b2dde090e4576828ac96e86a53c3cfdc95cc92f22115c5c4ddad715', 'release-public.pem': 'e34a273273bf357982b41c1ac8ee828e6f9a8848fe78c5989a3dc52e8d7891dd', 'Keelark-Access-Node-0.2.3-preview.17-Linux-amd64.tar.gz': '3c85d7135cb841b745f80d29fb16853f28430c7b4236ef62a783ba0c69d81643', 'Keelark-Access-Node-0.2.3-preview.17-Linux-arm64.tar.gz.manifest.json': 'ace4dca367af5e509eaa2f04ec6b2f1b43a88b00ce8dd3a07f4e981bc28c8230', 'Keelark-Access-Node-0.2.3-preview.17-Linux-amd64.tar.gz.sig': '3fbb9bc538190538443ccf15d8639cbc288d5853c5d9dec29691cbc213fa4b5b', 'SHA256SUMS': '2b9b30c93fc65d3ecf28c3d80802aa62722ae6d95c76d5d042c7ee47bb9f4448', 'RELEASE_NOTES.zh.md': '1872cea560db9b72e35bd6a979e04271d07224f1d80bb8dbaa6d125ce5c7d5df'}
          repo='Genesiu/keelmesh-releases';tag='access-node-v0.2.3-preview.17';rid='432620152'
          release=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/releases/'+rid]));assert release['draft'] and release['tag_name']==tag
          assets={a['name']:a for a in release['assets']};stage=pathlib.Path('accepted-linux-node');stage.mkdir()
          for name,want in sorted(expected.items()):
           url='https://keelmesh.com/releases/access-node/'+urllib.parse.quote(name)
           with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Keelark-Access-Updater/1'}),timeout=90) as r:
            assert r.status==200 and r.url.startswith('https://keelmesh.com/releases/access-node/');data=r.read()
           assert hashlib.sha256(data).hexdigest()==want,name
           old=assets.get(name)
           if old:
            assert old['state']=='uploaded' and old.get('digest')=='sha256:'+want,'refuse replacing a different release asset'
            continue
           request=urllib.request.Request('https://uploads.github.com/repos/'+repo+'/releases/'+rid+'/assets?name='+urllib.parse.quote(name),data=data,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/octet-stream','Accept':'application/vnd.github+json','User-Agent':'Keelark-Release-Mirror'})
           with urllib.request.urlopen(request,timeout=120) as r:uploaded=json.load(r)
           assert uploaded['name']==name and uploaded['size']==len(data) and uploaded.get('digest')=='sha256:'+want
           print('Verified mirrored asset:',name)
          final=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/releases/'+rid]));assert final['draft'];assert {a['name'] for a in final['assets']}==set(expected)
          assert all(a.get('digest')=='sha256:'+expected[a['name']] and a['state']=='uploaded' for a in final['assets'])
          subprocess.run(['gh','api','-X','PATCH','repos/'+repo+'/releases/'+rid,'-F','draft=false','-F','prerelease=true','-f','make_latest=false'],check=True,stdout=subprocess.DEVNULL)
          print('Linux node Preview 17 published with 11 accepted artifacts; private product source excluded.')
